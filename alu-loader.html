<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>铝材装柜 · 专用排柜 · ZhiBox</title>
<meta name="description" content="ZhiBox 铝材装柜：面向铝型材/长条件的专用排柜，支持柜内凸出物避让与分层管理。">
<meta name="theme-color" content="#0b1220">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
:root{--bg:#0b1220;--panel:#12203a;--panel2:#1a2a47;--border:#24344f;--border2:#2f4060;
--text:#e8eef7;--muted:#8b9ab0;--accent:#2dd4bf;--accent2:#60a5fa;--warn:#f59e0b;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{margin:0;background:radial-gradient(1200px 600px at 20% -10%,#132542,#0b1220 55%);color:var(--text);
overflow:hidden;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;}
button{font-family:inherit;cursor:pointer;}input{font-family:inherit;color:var(--text);}
::-webkit-scrollbar{width:8px;}::-webkit-scrollbar-thumb{background:#31456a;border-radius:4px;}
header{height:54px;background:rgba(15,26,46,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);
display:flex;align-items:center;gap:10px;padding:0 16px;position:relative;z-index:20;}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;}
.logo .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#2dd4bf,#0ea5e9);
display:flex;align-items:center;justify-content:center;color:#04211b;font-size:15px;font-weight:800;}
.spacer{flex:1;}
.hbtn{border:1px solid var(--border2);background:rgba(26,42,71,.6);color:var(--text);padding:7px 14px;border-radius:8px;font-size:13px;text-decoration:none;display:inline-flex;align-items:center;gap:4px;}
.hbtn:hover{border-color:var(--accent);}.hbtn.on{border-color:var(--accent);color:var(--accent);}
.only-m{display:none;}
main{display:flex;height:calc(100vh - 54px);}
aside{width:380px;flex:0 0 380px;background:var(--panel);border-right:1px solid var(--border);
display:flex;flex-direction:column;overflow:hidden;}
.aside-scroll{flex:1;overflow-y:auto;padding:16px;}
.sec{margin-bottom:18px;}
.sec-title{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.8px;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.sec-title::after{content:"";flex:1;height:1px;background:var(--border);}
.types{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;}
.type{border:1.5px solid var(--border2);background:var(--panel2);border-radius:9px;padding:9px 8px;text-align:center;font-size:12px;color:var(--muted);cursor:pointer;}
.type b{display:block;font-size:14px;color:var(--text);}
.type.on{border-color:var(--accent);background:rgba(45,212,191,.08);}.type.on b{color:var(--accent);}
.fld{margin-bottom:10px;}
.fld label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:4px;}
.fld input{width:100%;border:1px solid var(--border2);background:var(--panel2);border-radius:7px;padding:8px 10px;font-size:13px;outline:none;}
.fld input:focus{border-color:var(--accent);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.item{border:1px solid var(--border2);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--panel2);}
.item .row{display:flex;gap:8px;margin-bottom:6px;align-items:center;}
.item input{flex:1;min-width:0;border:1px solid var(--border2);background:var(--panel);border-radius:6px;padding:6px 8px;font-size:12px;outline:none;}
.item .del{border:none;background:none;color:var(--muted);font-size:14px;}
.addbtn{width:100%;border:1.5px dashed var(--border2);background:transparent;color:var(--muted);padding:12px;border-radius:9px;font-size:13px;}
.addbtn:hover{border-color:var(--accent);color:var(--accent);}
#viewport{flex:1;position:relative;overflow:hidden;}
#scene{width:100%;height:100%;display:block;}
@media (max-width:760px){aside{position:fixed;left:0;top:54px;bottom:0;z-index:30;width:86%;max-width:380px;transform:translateX(-100%);transition:.25s;}aside.open{transform:translateX(0);}.only-m{display:inline-flex;}.only-d{display:none;}}
</style>
</head>
<body>
<header>
  <div class="logo"><span class="mark">智</span><span>ZhiBox 铝材装柜</span></div>
  <div class="spacer"></div>
  <a class="hbtn" href="index.html">◆ 普通装柜</a>
  <a class="hbtn" href="custom-loader.html">拖拽装柜</a>
  <a class="hbtn on" href="alu-loader.html">铝材装柜</a>
  <a class="hbtn" href="special-size.html">特殊尺寸</a>
  <button class="hbtn only-m" id="sheetBtn">参数</button>
</header>
<main>
  <aside id="sheet">
    <div style="padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;"><b style="flex:1;">铝材排柜参数</b><button class="hbtn only-m" id="sheetClose">✕</button></div>
    <div class="aside-scroll">
      <div class="sec">
        <div class="sec-title">柜型与层数</div>
        <div class="types" id="types"></div>
        <div class="fld" style="margin-top:10px;"><label>层数（沿柜高分层）</label><input type="number" id="layers" value="3" min="1" max="10"></div>
      </div>
      <div class="sec">
        <div class="sec-title">柜内凸出物（自动避让）</div>
        <div class="grid2">
          <div class="fld"><label>凸出物高度 (cm)</label><input type="number" id="obstH" value="15"></div>
          <div class="fld"><label>距柜门距离 (cm)</label><input type="number" id="obstD" value="100"></div>
        </div>
      </div>
      <div class="sec">
        <div class="sec-title">型材清单（长×宽×高 cm）</div>
        <div id="items"></div>
        <button class="addbtn" id="addItem">+ 添加型材</button>
      </div>
      <div class="sec"><button class="addbtn" id="calc" style="border-style:solid;border-color:var(--accent);color:var(--accent);font-weight:600;">开始排柜</button></div>
    </div>
  </aside>
  <div id="viewport"><canvas id="scene"></canvas></div>
</main>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three.module.js",
  "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js",
  "three/addons/geometries/RoundedBoxGeometry.js": "./vendor/RoundedBoxGeometry.js"
} }
</script>
<script type="module" src="./alu-loader.js"></script>
</body>
</html>
