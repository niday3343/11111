<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>拖拽装柜 · ZhiBox 智能拼箱集运</title>
<meta name="description" content="ZhiBox 拖拽装柜：把柜门外的货物一件件拖进集装箱，拖到哪放到哪，自动吸附堆叠、防重叠防悬空，手机可直接操作。">
<meta name="theme-color" content="#0b1220">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
:root{--bg:#0b1220;--panel:#12203a;--panel2:#1a2a47;--border:#24344f;--border2:#2f4060;
--text:#e8eef7;--muted:#8b9ab0;--accent:#2dd4bf;--accent2:#60a5fa;--err:#f87171;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{margin:0;background:radial-gradient(1200px 600px at 20% -10%,#132542,#0b1220 55%);
color:var(--text);overflow:hidden;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;}
button{font-family:inherit;cursor:pointer;}
input{font-family:inherit;color:var(--text);}
::-webkit-scrollbar{width:8px;}::-webkit-scrollbar-thumb{background:#31456a;border-radius:4px;}
header{height:54px;background:rgba(15,26,46,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);
display:flex;align-items:center;gap:10px;padding:0 16px;z-index:20;position:relative;}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;}
.logo .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#2dd4bf,#0ea5e9);
display:flex;align-items:center;justify-content:center;color:#04211b;font-size:15px;font-weight:800;}
.spacer{flex:1;}
.hbtn{border:1px solid var(--border2);background:rgba(26,42,71,.6);color:var(--text);padding:7px 14px;border-radius:8px;font-size:13px;text-decoration:none;display:inline-flex;align-items:center;gap:4px;}
.hbtn:hover{border-color:var(--accent);}
.hbtn.on{border-color:var(--accent);color:var(--accent);}
.hbtn.primary{background:linear-gradient(135deg,#2dd4bf,#0ea5e9);color:#04211b;border:none;font-weight:600;}
.only-m{display:none;}
main{display:flex;height:calc(100vh - 54px);}
aside{width:360px;flex:0 0 360px;background:var(--panel);border-right:1px solid var(--border);
display:flex;flex-direction:column;overflow:hidden;}
.aside-scroll{flex:1;overflow-y:auto;padding:16px;}
.sec{margin-bottom:18px;}
.sec-title{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.8px;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.sec-title::after{content:"";flex:1;height:1px;background:var(--border);}
.types{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;}
.type{border:1.5px solid var(--border2);background:var(--panel2);border-radius:9px;padding:9px 8px;text-align:center;font-size:12px;color:var(--muted);}
.type b{display:block;font-size:14px;color:var(--text);}
.type.on{border-color:var(--accent);background:rgba(45,212,191,.08);}
.type.on b{color:var(--accent);}
.addbtn{flex:1;border:1.5px dashed var(--border2);background:transparent;color:var(--muted);padding:10px;border-radius:9px;font-size:13px;}
.addbtn:hover{border-color:var(--accent);color:var(--accent);}
.btnrow{display:flex;gap:8px;}
.pallet{display:flex;flex-wrap:wrap;gap:8px;}
.pallet-item{border:1px solid var(--border2);background:var(--panel2);border-radius:9px;padding:8px 12px;font-size:12px;display:flex;align-items:center;gap:6px;cursor:grab;}
.pallet-item .sz{color:var(--muted);font-size:10.5px;}
.pallet-item:hover{border-color:var(--accent);}
#viewport{flex:1;position:relative;overflow:hidden;}
#scene{width:100%;height:100%;display:block;}
.hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:10;
background:rgba(18,32,58,.9);border:1px solid var(--border2);border-radius:10px;padding:8px 16px;font-size:12px;color:var(--muted);}
.ov-tools{position:absolute;top:14px;right:14px;display:flex;flex-direction:column;gap:6px;z-index:10;}
.tool{border:1px solid var(--border2);background:rgba(18,32,58,.85);color:var(--muted);border-radius:7px;padding:6px 12px;font-size:12px;}
.tool.on{border-color:var(--accent);color:var(--accent);}
@media (max-width:760px){
  aside{position:fixed;left:0;top:54px;bottom:0;z-index:30;width:86%;max-width:360px;transform:translateX(-100%);transition:.25s;}
  aside.open{transform:translateX(0);}
  .only-m{display:inline-flex;} .only-d{display:none;}
}
</style>
</head>
<body>
<header>
  <div class="logo"><span class="mark">智</span><span>ZhiBox 拖拽装柜</span></div>
  <div class="spacer"></div>
  <a class="hbtn" href="index.html">◆ 普通装柜</a>
  <a class="hbtn on" href="custom-loader.html">拖拽装柜</a>
  <a class="hbtn" href="alu-loader.html">铝材装柜</a>
  <a class="hbtn" href="special-size.html">特殊尺寸</a>
  <button class="hbtn primary" id="autoFill">⚡ 自动铺满</button>
  <button class="hbtn only-m" id="sheetBtn">货物</button>
</header>
<main>
  <aside id="sheet">
    <div style="padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;">
      <b style="flex:1;">待装货物</b>
      <button class="hbtn only-m" id="sheetClose">✕</button>
    </div>
    <div class="aside-scroll">
      <div class="sec"><div class="sec-title">柜型</div><div class="types" id="types"></div></div>
      <div class="sec">
        <div class="sec-title">拖拽到柜内 · 自动吸附</div>
        <div class="pallet" id="pallet"></div>
        <div class="btnrow" style="margin-top:10px;">
          <button class="addbtn" id="addItem">+ 添加货物</button>
          <button class="addbtn" id="clearAll">清空已装</button>
        </div>
      </div>
    </div>
  </aside>
  <div id="viewport">
    <canvas id="scene"></canvas>
    <div class="ov-tools">
      <button class="tool" data-view="3d">立体</button>
      <button class="tool" data-view="top">俯视</button>
      <button class="tool" data-view="front">正视</button>
      <button class="tool on" id="shellToggle">柜体</button>
    </div>
    <div class="hint">← 从左侧拖动货物放入柜内，自动吸附堆叠、防重叠</div>
  </div>
</main>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three.module.js",
  "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js",
  "three/addons/geometries/RoundedBoxGeometry.js": "./vendor/RoundedBoxGeometry.js"
} }
</script>
<script type="module" src="./drag-loader.js"></script>
</body>
</html>
