<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ZhiBox · 智能拼箱集运</title>
<meta name="description" content="ZhiBox 智能拼箱集运：多货主拼柜、3D 装箱模拟、装载率与重心优化，手机浏览器直接打开。">
<meta name="theme-color" content="#0b1220">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ZhiBox">
<style>
:root{
  --bg:#0b1220; --bg2:#0f1a2e; --panel:#12203a; --panel2:#1a2a47;
  --border:#24344f; --border2:#2f4060;
  --text:#e8eef7; --muted:#8b9ab0;
  --accent:#2dd4bf; --accent2:#60a5fa; --warn:#f59e0b; --err:#f87171;
  --glow:0 0 24px rgba(45,212,191,.15);
  --shadow:0 8px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; background:radial-gradient(1200px 600px at 20% -10%, #132542 0%, var(--bg) 55%);
  color:var(--text); overflow:hidden; overscroll-behavior:none;
  -webkit-text-size-adjust:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px;
}
button{font-family:inherit; cursor:pointer; transition:.15s;}
input,select{font-family:inherit; color:var(--text);}

::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#31456a; border-radius:4px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- 顶栏 ---------- */
header{
  height:54px; background:rgba(15,26,46,.85); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px;
  padding:0 16px; position:relative; z-index:20;
}
.logo{display:flex; align-items:center; gap:10px; font-weight:700; font-size:17px; letter-spacing:.3px;}
.logo .mark{
  width:30px; height:30px; border-radius:8px;
  background:linear-gradient(135deg,#2dd4bf,#0ea5e9);
  display:flex; align-items:center; justify-content:center; color:#04211b;
  font-size:15px; font-weight:800; box-shadow:var(--glow);
}
.logo .sub{color:var(--muted); font-size:11px; font-weight:400; letter-spacing:.5px; margin-top:2px;}
.spacer{flex:1;}
.hbtn{
  border:1px solid var(--border2); background:rgba(26,42,71,.6); color:var(--text);
  padding:7px 14px; border-radius:8px; font-size:13px; white-space:nowrap;
}
.hbtn:hover{background:var(--panel2); border-color:var(--accent);}
.hbtn.primary{background:linear-gradient(135deg,#2dd4bf,#0ea5e9); color:#04211b; border:none; font-weight:600;}
.hbtn.primary:hover{filter:brightness(1.1);}
.only-m{display:none;}

/* ---------- 布局 ---------- */
main{display:flex; height:calc(100vh - 54px);}
aside{
  width:360px; flex:0 0 360px; background:var(--panel);
  border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden;
}
.aside-scroll{flex:1; overflow-y:auto; padding:16px;}

.sec{margin-bottom:20px;}
.sec-title{
  font-size:11.5px; font-weight:600; color:var(--muted); letter-spacing:.8px;
  margin-bottom:10px; display:flex; align-items:center; gap:8px;
}
.sec-title::after{content:""; flex:1; height:1px; background:var(--border);}

/* 柜型 */
.types{display:grid; grid-template-columns:repeat(4,1fr); gap:6px;}
.type{
  border:1.5px solid var(--border2); background:var(--panel2); border-radius:9px;
  padding:9px 4px 8px; text-align:center; font-size:12px; line-height:1.4; color:var(--muted);
}
.type b{display:block; font-size:14px; color:var(--text); font-weight:600;}
.type span{font-size:10.5px;}
.type:hover{border-color:#42a5f5;}
.type.on{border-color:var(--accent); background:rgba(45,212,191,.08); box-shadow:var(--glow);}
.type.on b{color:var(--accent);}
.type.custom{grid-column:1/-1; display:flex; align-items:center; justify-content:center; gap:8px; border-style:dashed;}
.type.custom b{display:inline; font-size:13px;}
.type.custom.on{background:rgba(45,212,191,.08); border-style:solid;}

/* 货物行 */
.item{
  border:1px solid var(--border2); border-radius:11px; padding:11px 12px; margin-bottom:9px;
  background:var(--panel2); position:relative;
}
.item:hover{border-color:#42a5f5;}
.item-head{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
.swatch{width:12px; height:12px; border-radius:4px; flex:0 0 auto; box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);}
.item-head input.nm{
  flex:1; min-width:0; border:none; background:none; font-size:13.5px; font-weight:600;
  color:var(--text); padding:2px; border-radius:5px; outline:none;
}
.item-head input.nm:focus{background:var(--panel); box-shadow:0 0 0 1.5px var(--accent);}
.item-head .del{
  border:none; background:none; color:var(--muted); font-size:15px; padding:2px 6px; border-radius:6px;
}
.item-head .del:hover{color:var(--err); background:rgba(248,113,113,.1);}

.grid3{display:grid; grid-template-columns:70px 1fr 1fr 1fr; gap:6px; align-items:center; margin-bottom:6px;}
.fld label{font-size:11px; color:var(--muted); display:block; margin-bottom:3px;}
.fld input{
  width:100%; border:1px solid var(--border2); background:var(--panel); border-radius:7px;
  padding:7px 9px; font-size:13px; outline:none;
}
.fld input:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(45,212,191,.12);}
.fld input::-webkit-outer-spin-button,.fld input::-webkit-inner-spin-button{-webkit-appearance:none;}

.row2{display:flex; align-items:center; gap:10px; margin-top:4px;}
.row2 .fld{flex:0 0 90px;}
.chips{display:flex; gap:6px; align-items:center;}
.chips span{font-size:11px; color:var(--muted);}
.chip{
  border:1px solid var(--border2); background:var(--panel); color:var(--muted);
  border-radius:6px; padding:4px 10px; font-size:11.5px;
}
.chip.on{border-color:var(--accent); color:var(--accent); background:rgba(45,212,191,.08);}

/* 货主标签（拼箱特色） */
.owner-tag{
  display:inline-flex; align-items:center; gap:4px; border-radius:5px;
  padding:2px 7px; font-size:10.5px; background:rgba(96,165,250,.12); color:#93c5fd;
}

.addbtn{
  flex:1; border:1.5px dashed var(--border2); background:transparent; color:var(--muted);
  padding:10px; border-radius:9px; font-size:13px;
}
.addbtn:hover{border-color:var(--accent); color:var(--accent);}

/* 预设 */
.presets{display:flex; flex-wrap:wrap; gap:6px;}
.preset{
  border:1px solid var(--border2); background:var(--panel2); color:var(--muted);
  border-radius:7px; padding:6px 12px; font-size:12px;
}
.preset:hover{border-color:var(--accent); color:var(--accent);}

/* 结果栏 */
.resultbar{
  border-top:1px solid var(--border); background:var(--bg2); padding:14px 16px;
}
.util{display:flex; align-items:center; gap:16px; margin-bottom:12px;}
.ring{
  width:60px; height:60px; border-radius:50%; flex:0 0 auto;
  background:conic-gradient(var(--accent) 0%, var(--border2) 0%);
  display:flex; align-items:center; justify-content:center; position:relative;
}
.ring::after{content:""; position:absolute; inset:6px; border-radius:50%; background:var(--bg2);}
.ring b{position:relative; z-index:1; font-size:13px; color:var(--accent);}
.util-info .lbl{font-size:11px; color:var(--muted);}
.util-info .big{font-size:14px; font-weight:600; margin-top:2px;}
.metric{display:flex; justify-content:space-between; align-items:center; font-size:12.5px; padding:4px 0; color:var(--muted);}
.metric b{color:var(--text); font-weight:600;}
.metric b.ok{color:var(--accent);}

/* 3D 画布区 */
#viewport{flex:1; position:relative; overflow:hidden;}
#scene{width:100%; height:100%; display:block;}

/* 覆盖层工具按钮 */
.ov-tools{position:absolute; top:14px; right:14px; display:flex; flex-direction:column; gap:6px; z-index:10;}
.tool{
  border:1px solid var(--border2); background:rgba(18,32,58,.85); color:var(--muted);
  backdrop-filter:blur(6px); border-radius:7px; padding:6px 12px; font-size:12px; text-align:center;
}
.tool:hover{border-color:var(--accent); color:var(--accent);}
.tool.on{border-color:var(--accent); color:var(--accent); background:rgba(45,212,191,.12);}
.ov-tools .tool-more{display:none;}

/* 顶部信息胶囊 */
.mchip{position:absolute; top:14px; left:14px; z-index:10; display:flex; align-items:center; gap:10px;
  background:rgba(18,32,58,.85); backdrop-filter:blur(6px); border:1px solid var(--border2);
  border-radius:9px; padding:8px 14px; font-size:12.5px;
}
.mchip b{color:var(--accent); font-size:15px;}
.mchip span{color:var(--muted);}

/* 播放条 */
.playbar{position:absolute; bottom:14px; left:50%; transform:translateX(-50%); z-index:10;
  display:flex; align-items:center; gap:8px; background:rgba(18,32,58,.9); backdrop-filter:blur(8px);
  border:1px solid var(--border2); border-radius:12px; padding:8px 14px;
}
.pbtn{border:none; border-radius:8px; padding:7px 12px; font-size:13px;}
.pbtn.main{background:linear-gradient(135deg,#2dd4bf,#0ea5e9); color:#04211b; font-weight:700; min-width:40px;}
.pbtn.exp{background:var(--panel2); color:var(--text); border:1px solid var(--border2);}
.pspeed{background:var(--panel); border:1px solid var(--border2); border-radius:7px; padding:5px 6px; font-size:12px; outline:none;}
#playRange{width:120px; accent-color:var(--accent);}

/* 响应式 */
@media (max-width:760px){
  aside{position:fixed; left:0; top:54px; bottom:0; z-index:30; width:86%; max-width:360px;
    transform:translateX(-100%); transition:.25s; box-shadow:var(--shadow);}
  aside.open{transform:translateX(0);}
  .only-m{display:inline-flex;}
  .only-d{display:none;}
  header{gap:6px; padding:0 10px;}
  .logo .sub{display:none;}
  .hbtn{padding:7px 10px; font-size:12px;}
  .playbar{padding:6px 10px;}
  #playRange{width:80px;}

  /* 移动端工具列：只显示「视角」一个按钮，点开收起其余 */
  .ov-tools{top:10px; right:10px; gap:4px; align-items:flex-end;}
  .ov-tools .tool{padding:5px 10px; font-size:11px;}
  .ov-tools.collapsed .tool{display:none;}
  .ov-tools.collapsed .tool-view-toggle{display:inline-block;}
  .ov-tools .tool-view-toggle{display:none;}
  .ov-tools.expanded .tool{display:inline-block;}
  .ov-tools.expanded .tool-view-toggle{display:none;}

  /* 顶栏只保留关键按钮，导航移到右下菜单 */
  .mchip{top:10px; left:10px; padding:6px 10px; font-size:11px;}
  .mchip b{font-size:13px;}
}
</style>
</head>
<body>

<header>
  <div class="logo"><span class="mark">智</span><span>ZhiBox<span class="sub"><br>智能拼箱集运</span></span></div>
  <div class="spacer"></div>
  <a class="hbtn only-d" href="custom-loader.html" style="text-decoration:none;">拖拽装柜</a>
  <a class="hbtn only-d" href="alu-loader.html" style="text-decoration:none;">铝材装柜</a>
  <a class="hbtn only-d" href="special-size.html" style="text-decoration:none;">特殊尺寸</a>
  <button class="hbtn only-d" id="csvBtn">导出装载清单</button>
  <button class="hbtn" id="shareBtn" title="生成可分享的方案链接">分享</button>
  <button class="hbtn smart" id="smartBtn" title="横竖侧立混排 + 重量均衡，自动装满整柜">🤖 智能满载</button>
  <button class="hbtn primary" id="packBtn">排柜</button>
  <button class="hbtn only-m" id="sheetBtn">清单</button>
</header>

<main>
  <aside id="sheet">
    <div class="sheet-hd" style="display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);">
      <b style="flex:1;">柜型与货物</b>
      <button class="hbtn only-m" id="csvBtnM">导出清单</button>
      <button class="hbtn only-m" id="sheetClose" style="padding:5px 10px;">✕</button>
    </div>
    <div class="aside-scroll">
      <div class="sec">
        <div class="sec-title">柜型</div>
        <div class="types" id="types"></div>
      </div>

      <div class="sec">
        <div class="sec-title">货物清单 <span style="margin-left:auto;font-size:10.5px;color:var(--accent2);">按货主分色</span></div>
        <div id="items"></div>
        <div style="display:flex; gap:8px; margin-top:4px;">
          <button class="addbtn" id="addItem">+ 添加货物</button>
          <button class="addbtn" id="importBtn">⇪ 导入表格</button>
        </div>
      </div>

      <div class="sec">
        <div class="sec-title">快速载入示例</div>
        <div class="presets" id="presets"></div>
      </div>
    </div>

    <div class="resultbar">
      <div class="util">
        <div class="ring" id="ring"><b id="utilVal">0%</b></div>
        <div class="util-info">
          <div class="lbl">体积装载率</div>
          <div class="big" id="utilBig">—</div>
        </div>
      </div>
      <div class="metric"><span>已装 / 总件数</span><b id="mCount">—</b></div>
      <div class="metric"><span>货物体积</span><b id="mVol">—</b></div>
      <div class="metric"><span>总毛重</span><b id="mWeight">—</b></div>
      <div class="metric"><span>占用层高</span><b id="mLayer">—</b></div>
      <div class="metric"><span>重心偏移（前后/左右）</span><b id="mCog" class="ok">—</b></div>
      <div class="metric"><span>剩余可用体积</span><b id="mLeft">—</b></div>
    </div>
  </aside>

  <div id="viewport">
    <canvas id="scene"></canvas>
    <div class="mchip"><b id="mChipPct">0%</b><span id="mChipCnt">0/0 件</span></div>
    <div class="ov-tools collapsed" id="ovTools">
      <button class="tool tool-view-toggle" id="viewToggle">👁 视图</button>
      <button class="tool" data-view="3d">立体视角</button>
      <button class="tool" data-view="front">柜门正视</button>
      <button class="tool" data-view="side">侧视</button>
      <button class="tool" data-view="top">俯视</button>
      <button class="tool on" id="layerToggle">分层查看</button>
      <button class="tool on" id="orderToggle">装载顺序</button>
      <button class="tool on" id="shellToggle">显示柜体</button>
    </div>
    <div class="playbar">
      <button class="pbtn main" id="playBtn">▶</button>
      <input type="range" id="playRange" min="0" max="100" value="0">
      <select class="pspeed" id="playSpeed">
        <option value="0.5">0.5×</option><option value="1" selected>1×</option>
        <option value="2">2×</option><option value="4">4×</option><option value="8">8×</option>
      </select>
      <button class="pbtn exp" id="exportBtn">⏺ 导出动画</button>
    </div>
  </div>
</main>

<input type="file" id="fileInput" accept=".xlsx,.xls,.csv" style="display:none;">

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js",
    "three/addons/geometries/RoundedBoxGeometry.js": "./vendor/RoundedBoxGeometry.js"
  }
}
</script>
<script src="./vendor/xlsx.full.min.js"></script>
<script type="module" src="./app.js"></script>

</body>
</html>
